<style>

  * { box-sizing:border-box; margin:0; padding:0 }
  html, body { height:100% }
  body {

      radial-gradient(1100px 700px at 50% 108%,rgba(63,217,192,.035),transparent 65%); }
  main { position:relative; width:100%; max-width:430px }
  .eyebrow { font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--teal);

  form { margin-top:30px; padding:26px; border:1px solid var(--ln2); border-radius:14px; background:var(--sf) }
  label { display:block; font-size:10.5px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
    color:var(--tx2); margin-bottom:10px }
  input { width:100%; font:inherit; font-size:15px; color:var(--tx); background:var(--bg2);
    border:1px solid var(--ln2); border-radius:9px; padding:11px 14px; outline:none;
    transition:border-color .4s var(--ease),box-shadow .4s var(--ease) }
  input:focus { border-color:rgba(63,217,192,.46); box-shadow:0 0 0 3px var(--tealg) }
  input:disabled { opacity:.5 }
  button { width:100%; margin-top:14px; padding:12px; border-radius:9px; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:600; line-height:1; letter-spacing:.02em; color:var(--teal);
    background:rgba(63,217,192,.10); border:1px solid rgba(63,217,192,.26);
    transition:background .4s var(--ease),border-color .4s var(--ease),transform .35s var(--ease) }
  button:hover { background:rgba(63,217,192,.18); border-color:rgba(63,217,192,.46) }
  button:active { transform:scale(.985) }
  button:disabled { opacity:.55; cursor:progress }
  .aviso { margin-top:12px; font-size:12.5px; color:var(--emb) }
  .aviso:empty { display:none }
  footer { margin-top:20px; font-size:11.5px; line-height:1.6; color:var(--tx3) }

<script>
(function () {
  'use strict';
  var C = JSON.parse(document.getElementById('carga').textContent);
  var form = document.getElementById('acceso'), campo = document.getElementById('clave'),
      boton = document.getElementById('abrir'), aviso = document.getElementById('aviso');
  var SES = 'tablero-pai-clave';
  var bytes = function (b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  var ocupado = function () { aviso.textContent = ''; boton.disabled = true; boton.textContent = 'Abriendo…'; };
  var libre = function () { boton.disabled = false; boton.textContent = 'Abrir tablero'; };

  // Safari anterior a 16.4 no trae DecompressionStream: mejor decirlo que culpar a la contraseña
  if (!(window.crypto && crypto.subtle && window.DecompressionStream && window.TextEncoder)) {
    campo.disabled = true; boton.disabled = true;
    aviso.textContent = 'Este navegador no puede abrir el tablero. Use Chrome o Edge actualizados.';
    return;
  }

  async function abrir(clave) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
    var llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(C.sal), iterations: C.it, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(C.iv) }, llave, bytes(C.dato));
    var html = await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    try { sessionStorage.setItem(SES, clave); } catch (e) {}
    document.open(); document.write(html); document.close();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    ocupado();
    abrir(campo.value).catch(function (err) {
      libre();
      // GCM no descifra si la contraseña no es la correcta (o si el archivo fue alterado)
      aviso.textContent = err && err.name === 'OperationError' ? 'Contraseña incorrecta.' : 'No se pudo abrir el tablero en este navegador.';
      campo.select();
    });
  });

  // al recargar en la misma pestaña no se vuelve a pedir la contraseña; al cerrar la pestaña, sí
  var guardada = null;
  try { guardada = sessionStorage.getItem(SES); } catch (e) {}
  if (guardada) { ocupado(); abrir(guardada).catch(function () { try { sessionStorage.removeItem(SES); } catch (e) {} libre(); }); }
})();
</script>
